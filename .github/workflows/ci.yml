name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Estático + unitários (sem banco: o build gera o Prisma Client sem conectar
  # e os testes unitários mockam o prisma).
  qualidade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: "postgresql://user:pass@localhost:5432/farmavida_next"
      AUTH_SECRET: "ci-only-0123456789abcdef0123456789abcdef"
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_APP_NAME: "FarmaVida"
      NEXT_PUBLIC_BASE_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm run build

  # E2E de verdade: Postgres de serviço (descartável) migrado + semeado,
  # build de produção (CSP estrita ativa) e Playwright — incluindo os specs
  # que escrevem no banco (confirmação explícita de banco descartável).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: farmavida
          POSTGRES_PASSWORD: farmavida
          POSTGRES_DB: farmavida_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U farmavida -d farmavida_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: "postgresql://farmavida:farmavida@localhost:5432/farmavida_test"
      DATABASE_URL_UNPOOLED: "postgresql://farmavida:farmavida@localhost:5432/farmavida_test"
      INTEGRATION_DATABASE_URL: "postgresql://farmavida:farmavida@localhost:5432/farmavida_test"
      INTEGRATION_ALLOW_WRITES: "I_UNDERSTAND_THIS_IS_A_DISPOSABLE_DATABASE"
      E2E_DATABASE_URL: "postgresql://farmavida:farmavida@localhost:5432/farmavida_test"
      E2E_DATABASE_URL_UNPOOLED: "postgresql://farmavida:farmavida@localhost:5432/farmavida_test"
      AUTH_SECRET: "ci-e2e-0123456789abcdef0123456789abcdef"
      AUTH_TRUST_HOST: "true"
      AUTH_URL: "http://localhost:3210"
      NEXT_PUBLIC_APP_NAME: "FarmaVida"
      NEXT_PUBLIC_BASE_URL: "http://localhost:3210"
      E2E_ALLOW_WRITES: "I_UNDERSTAND_THIS_IS_A_DISPOSABLE_DATABASE"
      ALLOW_DESTRUCTIVE_SEED: "I_UNDERSTAND_THIS_WILL_DELETE_DATA"
      SEED_OWNER_PASSWORD: "ci-owner-password"
      SEED_BRANCH_PASSWORD: "ci-branch-password"
      SEED_CUSTOMER_PASSWORD: "ci-customer-password"
      PW_WEB_COMMAND: "npx next start -p 3210"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run test:integration
      - run: npm run db:seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
